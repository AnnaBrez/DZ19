plugins {
    id 'java'
    id("io.qameta.allure") version "2.12.0"
}

group = 'brezitskaya'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.9.1')
    testImplementation 'org.junit.jupiter:junit-jupiter:5.9.1'
    implementation 'org.junit.jupiter:junit-jupiter-api:5.9.1'
    testImplementation 'io.qameta.allure:allure-junit5:2.26.0'
    implementation 'org.seleniumhq.selenium:selenium-java:4.31.0'
    implementation 'org.assertj:assertj-core:3.25.3'
    implementation 'org.apache.httpcomponents.client5:httpclient5:5.3.1'
    testImplementation 'org.awaitility:awaitility:4.2.0'
    implementation 'com.codeborne:selenide:7.3.1'
    implementation 'io.qameta.allure:allure-selenide:2.24.0'
    implementation('org.codehaus.groovy:groovy-all:3.0.18')
    implementation 'io.appium:java-client:9.2.2'
    implementation 'jakarta.persistence:jakarta.persistence-api:3.2.0-M2'
    implementation 'com.h2database:h2:2.2.224'
    implementation 'org.hibernate.orm:hibernate-core:6.5.2.Final'
    compileOnly 'org.projectlombok:lombok:1.18.32'
    annotationProcessor 'org.projectlombok:lombok:1.18.32'
    testCompileOnly 'org.projectlombok:lombok:1.18.32'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.32'
}

test {
    useJUnitPlatform()
}

tasks.register('smokeTest', Test) {
    useJUnitPlatform() {
        includeTags 'smoke', 'api'
    }
}

